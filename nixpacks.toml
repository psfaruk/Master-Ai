# Nixpacks configuration for Railway
# Builds the Next.js app with standalone output and runs it.

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = [
  "echo 'Installing dependencies with bun...'",
  "bun install --frozen-lockfile"
]

[phases.build]
cmds = [
  "echo 'Building Next.js app...'",
  # Next.js build with standalone output. Since Next 13.4+, `output: "standalone"`
  # automatically traces and copies static + public assets into .next/standalone,
  # so no manual `cp -r` is needed.
  "bun run build"
]

[start]
cmd = "node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
PORT = "{{ PORT }}"
HOSTNAME = "0.0.0.0"
